services:
  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    restart: unless-stopped
    environment:
      - EMQX_NAME=emqx
    volumes:
      - /opt/emqx/data
      - /opt/emqx/log
    ports:
      - "1883:1883"   
      - "8083:8083"   
      - "8084:8084"   
      - "8883:8883"   
      - "18083:18083"